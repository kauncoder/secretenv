[package]
name = "secretenv-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "secretenv"
path = "src/main.rs"

[dependencies]
secretenv-core = { path = "../secretenv-core" }
clap = { version = "4.6", features = ["derive","env"] }
anyhow = "1.0"
secrecy = "0.10.3"
rpassword = "7.4"
tempfile = "3.27.0"